{% extends "base.html" %}

{% block title %}
Staff Login | Line Eight
{% endblock %}

{% block content %}

<div class="staff-login-page">

    <div class="staff-login-card">

        <div class="staff-login-icon">
            <i class="bi bi-shield-lock"></i>
        </div>

        <h1>Staff Login</h1>

        <p>
            Sign in to access the Line Eight dashboard.
        </p>

        {% if error %}
            <div class="login-error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button
                type="submit"
                class="login-btn"
            >
                <i class="bi bi-box-arrow-in-right"></i>
                Sign In
            </button>

        </form>

        <a href="{% url 'home' %}" class="back-home">
            <i class="bi bi-arrow-left"></i>
            Back to website
        </a>

    </div>

</div>

{% endblock %}
