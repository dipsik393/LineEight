{% load static %}

<aside class="sidebar">

    <!-- LOGO -->
    <div class="logo">
        <h2>
            Line <span>Eight</span>
        </h2>
    </div>


    <ul class="sidebar-menu">

        <!-- DASHBOARD -->
        <li>
            <a href="{% url 'dashboard' %}"
               class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">

                <i class="bi bi-grid"></i>

                <span>Dashboard</span>

            </a>
        </li>


        <!-- PROJECTS -->
        <li>
            <a href="{% url 'dashboard_projects' %}"
               class="{% if request.resolver_match.url_name == 'dashboard_projects' %}active{% endif %}">

                <i class="bi bi-folder"></i>

                <span>Projects</span>

            </a>
        </li>


        <!-- BLOGS -->
        <li>
            <a href="{% url 'dashboard_blogs' %}"
               class="{% if request.resolver_match.url_name == 'dashboard_blogs' %}active{% endif %}">

                <i class="bi bi-newspaper"></i>

                <span>Blogs</span>

            </a>
        </li>


        <!-- CLIENTS -->
        <li>
            <a href="{% url 'dashboard_clients' %}"
               class="{% if request.resolver_match.url_name == 'dashboard_clients' %}active{% endif %}">

                <i class="bi bi-people"></i>

                <span>Clients</span>

            </a>
        </li>


        <!-- MESSAGES -->
        <li>
            <a href="{% url 'dashboard_messages' %}"
               class="{% if request.resolver_match.url_name == 'dashboard_messages' %}active{% endif %}">

                <i class="bi bi-envelope"></i>

                <span>Messages</span>

                {% if unread_messages > 0 %}
                    <span class="sidebar-badge">
                        {{ new_messages }}
                    </span>
                {% endif %}

            </a>
        </li>


        <!-- CLIENT MESSAGES -->
        <li>
            <a href="{% url 'client_messages_dashboard' %}"
               class="{% if request.resolver_match.url_name == 'client_messages_dashboard' %}active{% endif %}">

                <i class="bi bi-chat-square-text"></i>

                <span>Client Messages</span>

                {% if client_unread_messages > 0 %}
                    <span class="sidebar-badge">
                        {{ client_unread_messages }}
                    </span>
                {% endif %}

            </a>
        </li>


        <!-- AI ASSISTANT -->
        <li>
            <a href="{% url 'ai_assistant' %}"
               class="{% if request.resolver_match.url_name == 'ai_assistant' %}active{% endif %}">

                <i class="bi bi-robot"></i>

                <span>AI Assistant</span>

            </a>
        </li>


        <!-- SETTINGS -->
        <li>
            <a href="{% url 'dashboard_settings' %}"
               class="{% if request.resolver_match.url_name == 'dashboard_settings' %}active{% endif %}">

                <i class="bi bi-gear"></i>

                <span>Settings</span>

            </a>
        </li>

    </ul>

</aside>
