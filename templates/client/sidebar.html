{% load static %}

<aside class="client-sidebar">

    <!-- Logo -->

    <div class="sidebar-logo">

        <a href="{% url 'client_dashboard' %}">

            {% if site_settings.logo %}

                <img
                    src="{{ site_settings.logo.url }}"
                    alt="{{ site_settings.company_name }}"
                >

            {% else %}

                <span class="logo-line">Line</span>
                <span class="logo-eight">Eight</span>

            {% endif %}

        </a>

    </div>


    <!-- Navigation -->

    <ul>

        <!-- Dashboard -->

        <li>

            <a
                href="{% url 'client_dashboard' %}"
                class="{% if request.resolver_match.url_name == 'client_dashboard' %}active{% endif %}"
            >

                <i class="bi bi-speedometer2"></i>

                <span>
                    Dashboard
                </span>

            </a>

        </li>


        <!-- Projects -->

        <li>

            <a
                href="{% url 'client_projects' %}"
                class="{% if request.resolver_match.url_name == 'client_projects' %}active{% endif %}"
            >

                <i class="bi bi-folder2-open"></i>

                <span>
                    Projects
                </span>

            </a>

        </li>


        <!-- Files -->

        <li>

            <a
                href="{% url 'client_files' %}"
                class="{% if request.resolver_match.url_name == 'client_files' %}active{% endif %}"
            >

                <i class="bi bi-cloud-arrow-down"></i>

                <span>
                    Files
                </span>

            </a>

        </li>


        <!-- Messages -->

        <li>

            <a
                href="{% url 'client_messages_list' %}"
                class="{% if request.resolver_match.url_name == 'client_messages_list' %}active{% endif %}"
            >

                <i class="bi bi-chat-dots"></i>

                <span>
                    Messages
                </span>

                {% if new_messages %}

                    <span class="client-notification-badge">
                        {{ new_messages }}
                    </span>

                {% endif %}

            </a>

        </li>


        <!-- AI Assistant -->

        <li class="sidebar-item">

            <a
                href="{% url 'client_ai' %}"
                class="sidebar-link {% if request.resolver_match.url_name == 'client_ai' %}active{% endif %}"
            >

                <i class="bi bi-robot"></i>

                <span>
                    AI Assistant
                </span>

            </a>

        </li>


        <!-- Change Password -->

        <li>

            <a
                href="{% url 'client_change_password' %}"
                class="{% if request.resolver_match.url_name == 'client_change_password' %}active{% endif %}"
            >

                <i class="bi bi-shield-lock"></i>

                <span>
                    Change Password
                </span>

            </a>

        </li>


        <!-- Logout -->

        <li class="sidebar-logout">

            <a href="{% url 'client_logout' %}">

                <i class="bi bi-box-arrow-right"></i>

                <span>
                    Logout
                </span>

            </a>

        </li>

    </ul>

</aside>
