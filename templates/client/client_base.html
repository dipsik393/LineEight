{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>

        {% block title %}Client Portal{% endblock %}

    </title>

    <link rel="stylesheet"
          href="{% static 'css/client.css' %}">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    

     {% block extra_css %}
     {% endblock %}     
</head>

<body>

<div class="client-layout">

    {% include "client/sidebar.html" %}

    <div class="client-main">

        {% include "client/navbar.html" %}

        <main class="client-content">

            {% block content %}

            {% endblock %}

        </main>

    </div>

</div>

</body>

</html>
