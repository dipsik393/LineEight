{% extends "base.html" %}

{% block title %}

Client Login

{% endblock %}

{% block content %}

<section class="login-page">

<div class="container">

<div class="login-card">

<h2>

Client Portal

</h2>

<p>

Login to view your projects.

</p>

{% if error %}

<div class="alert alert-danger">

{{ error }}

</div>

{% endif %}

<form method="POST">

{% csrf_token %}

<input

type="text"

name="username"

placeholder="Username"

required>

<input

type="password"

name="password"

placeholder="Password"

required>

<button class="primary-btn">

Login

</button>

</form>

</div>

</div>

</section>

{% endblock %}
